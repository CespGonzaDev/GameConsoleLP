name: GameConsole CI

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  frontend-build:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'gameconsole-web/package.json'

      - name: Install dependencies
        working-directory: ./gameconsole-web
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: TypeScript Check and Vite Build
        working-directory: ./gameconsole-web
        run: npm run build

  prolog-service-test:
    name: Prolog AI Service Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if prolog-service exists
        id: check_prolog
        run: |
          if [ -d "prolog-service" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Python 3.11
        if: steps.check_prolog.outputs.exists == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'prolog-service/requirements.txt'

      - name: Install SWI-Prolog
        if: steps.check_prolog.outputs.exists == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y swi-prolog swi-prolog-nox curl

      - name: Install Python dependencies & Run Pytest
        if: steps.check_prolog.outputs.exists == 'true'
        working-directory: ./prolog-service
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pytest
          if [ -d "tests" ]; then
            pytest tests/
          fi

  docker-dryrun:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [frontend-build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Web Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./gameconsole-web
          push: false
          tags: gameconsole-frontend:ci-test
