name: GameConsole CI

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  frontend-build:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'gameconsole-web/package-lock.json'

      - name: Install dependencies
        working-directory: ./gameconsole-web
        run: npm ci

      - name: TypeScript Check and Vite Build
        working-directory: ./gameconsole-web
        run: npm run build

  prolog-service-test:
    name: Prolog AI Service Tests (plunit + pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'prolog-service/requirements-dev.txt'

      - name: Install SWI-Prolog
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends swi-prolog curl

      - name: Prolog unit tests (plunit)
        working-directory: ./prolog-service
        run: swipl -q -g run_tests -t halt tests/battleship_ai.plt

      - name: Install Python dependencies
        working-directory: ./prolog-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: API and solver tests (pytest)
        working-directory: ./prolog-service
        run: |
          # Los tests de paridad Prolog/Python y "sin fallback _PY" solo se saltan si no hay swipl
          command -v swipl
          pytest tests/ -v

  docker-build:
    name: Docker Images Build & Smoke Test
    runs-on: ubuntu-latest
    needs: [frontend-build, prolog-service-test]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Prolog AI image
        uses: docker/build-push-action@v5
        with:
          context: ./prolog-service
          push: false
          load: true
          tags: gameconsole-prolog-ai:ci-test
          cache-from: type=gha,scope=prolog
          cache-to: type=gha,scope=prolog,mode=max

      - name: Build Web image
        uses: docker/build-push-action@v5
        with:
          context: ./gameconsole-web
          push: false
          load: true
          tags: gameconsole-web:ci-test
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Validate docker-compose.yml
        run: docker compose -f docker-compose.yml config --quiet

      - name: Smoke test Prolog image (/health and next-move)
        run: |
          docker run -d --name prolog-ci -p 5000:5000 gameconsole-prolog-ai:ci-test
          for i in $(seq 1 20); do
            curl -fs http://127.0.0.1:5000/health && break || sleep 1
          done
          curl -fs http://127.0.0.1:5000/health | grep '"prologEngine":"SWI-Prolog"'
          curl -fs -X POST http://127.0.0.1:5000/api/ai/battleship/next-move \
            -H 'Content-Type: application/json' \
            -d '{"matchId":"00000000-0000-4000-8000-000000000000","difficulty":"tactical","boardDimensions":{"rows":10,"cols":10},"shotsHistory":[],"remainingShipsLengths":[5,4,3,3,2]}' \
            | grep '"mode":"HUNT"'
          docker rm -f prolog-ci

      - name: Validate generated nginx config (starts without GameStats/Prolog running)
        run: docker run --rm gameconsole-web:ci-test nginx -t
