# GameConsole Compose: Consola Web + Microservicio Prolog IA
# Se conecta a la red externa 'gamestats-net' creada por el stack GameStats (Go + Scala).
#
# Uso:
#   1) Levantar GameStats primero (crea la red):   cd ../GameStats && docker compose up --build -d --wait
#      o, si la red aún no existe:                 docker network create gamestats-net
#   2) docker compose up --build -d
#   3) docker compose down
#
# Si el contenedor de ingestión Go de GameStats NO se llama "ingestion-go" en la red,
# indícalo con GAMESTATS_UPSTREAM (host:puerto), p. ej.:
#   GAMESTATS_UPSTREAM=gamestats-ingestion:8080 docker compose up --build -d

name: gameconsole

services:
  # Microservicio de IA en Prolog (SWI-Prolog + FastAPI) para Battleship
  prolog-ai-service:
    build:
      context: ./prolog-service
    image: gameconsole-prolog-ai:latest
    container_name: prolog-ai-service
    hostname: prolog-ai-service
    ports:
      - "${PROLOG_PORT:-5000}:5000"
    networks:
      - gamestats-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # Consola Web (React + TypeScript + Vite servido con Nginx) en :3000
  gameconsole-web:
    build:
      context: ./gameconsole-web
    image: gameconsole-web:latest
    container_name: gameconsole-web
    environment:
      GAMESTATS_UPSTREAM: ${GAMESTATS_UPSTREAM:-ingestion-go:8080}
      PROLOG_UPSTREAM: prolog-ai-service:5000
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - gamestats-net
    depends_on:
      prolog-ai-service:
        condition: service_healthy
    restart: unless-stopped

networks:
  gamestats-net:
    name: gamestats-net
    external: true
