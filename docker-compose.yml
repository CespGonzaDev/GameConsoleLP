# GameConsole Compose: Frontend Web + Microservicio Prolog IA
# Se conecta a la red externa 'gamestats-net' compartida con GameStats Ingestion (Go) y Analysis (Scala).
#
# Uso:
#   docker network create gamestats-net   # (si la red aún no fue creada por P1/GameStats)
#   docker compose up --build -d
#   docker compose down

name: gameconsole

services:
  # Microservicio de IA en Prolog (SWI-Prolog + FastAPI) para Battleship
  gameconsole-prolog-ai:
    build:
      context: ./prolog-service
    image: gameconsole-prolog-ai:latest
    container_name: prolog-ai-service
    hostname: prolog-ai-service
    ports:
      - "${PROLOG_PORT:-5000}:5000"
    networks:
      gamestats-net:
        aliases:
          - prolog-ai-service
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # Consola Web (React 19 + TypeScript + Vite + Tailwind servido con Nginx)
  gameconsole-frontend:
    build:
      context: ./gameconsole-web
    image: gameconsole-frontend:latest
    container_name: gameconsole-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - gamestats-net
    depends_on:
      gameconsole-prolog-ai:
        condition: service_started
    restart: unless-stopped

networks:
  gamestats-net:
    name: gamestats-net
    external: true
